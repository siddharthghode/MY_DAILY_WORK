services:
  db:
    image: postgres:16-alpine
    container_name: storage_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-object_storage_db}
      POSTGRES_USER: ${DB_USER:-storage_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-storage_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-storage_user} -d ${DB_NAME:-object_storage_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: storage_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: storage_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc:RELEASE.2024-10-08T12-42-04Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin};
      /usr/bin/mc mb --ignore-existing local/${AWS_STORAGE_BUCKET_NAME:-my-storage-bucket};
      /usr/bin/mc anonymous set download local/${AWS_STORAGE_BUCKET_NAME:-my-storage-bucket}/public;
      echo 'MinIO bucket initialized successfully';
      exit 0;
      "

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storage_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key-storage}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-object_storage_db}
      DB_USER: ${DB_USER:-storage_user}
      DB_PASSWORD: ${DB_PASSWORD:-storage_password}
      DB_HOST: db
      DB_PORT: "5432"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-my-storage-bucket}
      AWS_S3_REGION_NAME: us-east-1
      AWS_S3_ENDPOINT_URL: http://minio:9000
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storage_celery_worker
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-object_storage_db}
      DB_USER: ${DB_USER:-storage_user}
      DB_PASSWORD: ${DB_PASSWORD:-storage_password}
      DB_HOST: db
      DB_PORT: "5432"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-my-storage-bucket}
      AWS_S3_ENDPOINT_URL: http://minio:9000
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - web
      - redis

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storage_celery_beat
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - celery_worker

volumes:
  postgres_data:
  minio_data:
